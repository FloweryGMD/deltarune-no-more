<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deltarune No More - Credits</title>
  
  <!-- TAB ICON (FAVICON) -->
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a0f1e;
      background-image: url('bg3.png');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      image-rendering: pixelated;
      font-family: Arial, sans-serif;
      color: #fff;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .navbar {
      width: 100%;
      height: 70px;
      background-color: rgba(0, 0, 0, 0.85);
      border-bottom: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
    }

    .nav-logo img {
      height: 45px;
      display: block;
      image-rendering: pixelated;
    }

    .nav-center {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .nav-img-btn {
      height: 40px;
      width: auto;
      display: block;
      image-rendering: pixelated;
      transition: filter 0.1s ease;
      filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.5));
    }

    .nav-img-btn:hover {
      filter: brightness(1.3) drop-shadow(0px 3px 3px rgba(0,0,0,0.7));
      cursor: pointer;
    }

    .main-container {
      padding-top: 110px;
      padding-bottom: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .credits-box {
      background-color: rgba(0, 0, 0, 0.85);
      border: 3px solid #fff;
      padding: 30px 40px;
      max-width: 650px;
      width: 90%;
      text-align: center;
      box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.8);
    }

    .credits-title {
      font-size: 28px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-bottom: 2px dashed #555;
      padding-bottom: 10px;
    }

    .credit-item {
      margin-bottom: 20px;
    }

    .credit-role {
      font-size: 14px;
      color: #ffb703;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .credit-name-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .oc-icon-pixel {
      height: 48px;
      width: auto;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .oc-icon-smooth {
      height: 44px;
      width: 44px;
      object-fit: cover;
      border-radius: 50%;
    }

    .credit-name {
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 0px #000;
    }

    .secret-door {
      position: fixed;
      bottom: 15px;
      right: 15px;
      opacity: 0.4;
      transition: opacity 0.3s ease, transform 0.2s ease;
      z-index: 999;
    }

    .secret-door img {
      width: 30px;
      height: auto;
      display: block;
      image-rendering: pixelated;
    }

    .secret-door:hover {
      opacity: 1;
      transform: scale(1.1);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="nav-logo">
      <img src="logo.png" alt="Deltarune No More Logo">
    </div>

    <div class="nav-center">
      <a href="index.html"><img src="btn_Home.png" alt="Home" class="nav-img-btn"></a>
      <a href="about.html"><img src="btn_about.png" alt="About" class="nav-img-btn"></a>
      <a href="credits.html"><img src="btn_credits.png" alt="Credits" class="nav-img-btn"></a>
    </div>

    <div>
      <a href="https://www.mediafire.com/file/6ndysgoz3f590xr/DELTARUNE_NO_MORE.7z/file" target="_blank">
        <img src="btn_download.png" alt="Download" class="nav-img-btn">
      </a>
    </div>
  </div>

  <div class="main-container">
    <div class="credits-box">
      <div class="credits-title">CREDITS</div>

      <!-- MOD CREATORS -->
      <div class="credit-item">
        <div class="credit-role">Mod Made By</div>
        
        <div class="credit-name-group" style="margin-bottom: 10px;">
          <img src="pixel_malik_oc.png" alt="pixel malik" class="oc-icon-smooth">
          <span class="credit-name">pixel malik</span>
        </div>

        <div class="credit-name-group">
          <img src="yuko_oc.png" alt="yuko" class="oc-icon-smooth">
          <span class="credit-name">yuko</span>
        </div>
      </div>

      <!-- WEBSITE CREATOR -->
      <div class="credit-item">
        <div class="credit-role">Website Made By</div>
        <div class="credit-name-group">
          <img src="flowery.jpg" alt="floweryGMD" class="oc-icon-pixel">
          <span class="credit-name">floweryGMD</span>
        </div>
      </div>

      <!-- EMOTIONAL SUPPORT :D -->
      <div class="credit-item">
        <div class="credit-role">Emotional Support</div>
        <div class="credit-name-group">
          <img src="ozu_oc.png" alt="Ozu" class="oc-icon-smooth">
          <span class="credit-name">Ozu</span>
        </div>
      </div>

      <!-- BETA TESTER -->
      <div class="credit-item">
        <div class="credit-role">Beta Tester</div>
        <div class="credit-name-group">
          <img src="metal_hazem_oc.png" alt="Metal Hazem" class="oc-icon-smooth">
          <span class="credit-name">Metal Hazem</span>
        </div>
      </div>

      <!-- ORIGINAL GAME -->
      <div class="credit-item">
        <div class="credit-role">Original Game & Assets</div>
        <div class="credit-name">Toby Fox & Team Deltarune</div>
      </div>

    </div>
  </div>

  <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" class="secret-door" title="???">
    <img src="gaster_door.png" alt="???">
  </a>

</body>
</html>
