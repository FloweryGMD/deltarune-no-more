<!DOCTYPE html>
<html lang="en">
<head>

  <!-- TAB ICON (FAVICON) -->
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a0f1e;
      background-image: url('bg1.png');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      image-rendering: pixelated;
      font-family: Arial, sans-serif;
      color: #fff;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .navbar {
      width: 100%;
      height: 70px;
      background-color: rgba(0, 0, 0, 0.85);
      border-bottom: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
    }

    .nav-logo img {
      height: 45px;
      display: block;
      image-rendering: pixelated;
    }

    .nav-center {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .nav-img-btn {
      height: 40px;
      width: auto;
      display: block;
      image-rendering: pixelated;
      transition: filter 0.1s ease, transform 0.1s ease;
      filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.5));
    }

    .nav-img-btn:hover {
      filter: brightness(1.3) drop-shadow(0px 3px 3px rgba(0,0,0,0.7));
      cursor: pointer;
    }

    /* CUSTOM BLUE DISCORD BUTTON */
    .discord-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #5865F2;
      color: #ffffff;
      font-weight: bold;
      font-size: 14px;
      text-decoration: none;
      padding: 8px 16px;
      border: 2px solid #ffffff;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0px 2px 4px rgba(0,0,0,0.5);
      transition: background-color 0.2s ease, transform 0.1s ease, filter 0.2s ease;
    }

    .discord-btn:hover {
      background-color: #4752C4;
      filter: brightness(1.1);
      transform: translateY(-1px);
      cursor: pointer;
    }

    .discord-icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .main-container {
      padding-top: 150px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .main-logo {
      width: 400px;
      max-width: 90%;
      image-rendering: pixelated;
      filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.6));
    }

    .secret-door {
      position: fixed;
      bottom: 15px;
      right: 15px;
      opacity: 0.4;
      transition: opacity 0.3s ease, transform 0.2s ease;
      z-index: 999;
    }

    .secret-door img {
      width: 30px;
      height: auto;
      display: block;
      image-rendering: pixelated;
    }

    .secret-door:hover {
      opacity: 1;
      transform: scale(1.1);
      cursor: pointer;
    }
  </style>
</head>
